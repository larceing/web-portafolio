# Cabeceras de seguridad. Se incluyen en el server y en cada location que tenga
# su propio add_header, porque nginx no hereda los add_header del server en un
# location que defina alguno.
#
# CSP: todo sale del propio sitio salvo las fuentes de Google y los marcos de
# las publicaciones de LinkedIn (/linkedin/). 'unsafe-inline' en estilos solo
# cubre los atributos style="--c:..." de las teselas.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://www.linkedin.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
