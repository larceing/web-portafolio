server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Una sola dirección canónica y siempre cifrada, lo fuerce o no el proxy.
    if ($host = "www.luiscontacto03.com") {
        return 301 https://luiscontacto03.com$request_uri;
    }
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # La página se revalida siempre; lo demás se guarda una semana.
    location ~ /index\.html$ {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(css|js|webp|png|svg)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
