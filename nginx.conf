# Fuera de arcedatalab.com (DEV, pro.luiscontacto03.com/web/…) la web no se indexa.
map $host $robots_cabecera {
    ~*^(www\.)?arcedatalab\.com$ "";
    default "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    absolute_redirect off;

    # La web vive en arcedatalab.com. Las direcciones anteriores
    # (www.arcedatalab.com, henry.arcedatalab.com, luiscontacto03.com y su www)
    # se redirigen con la misma ruta. Los subdominios de luiscontacto03.com
    # (pro., dev., users., citas.…) van a otros contenedores y no pasan por aquí.
    if ($host ~* ^(www\.arcedatalab\.com|henry\.arcedatalab\.com|(www\.)?luiscontacto03\.com)$) {
        return 301 https://arcedatalab.com$request_uri;
    }
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    charset utf-8;
    charset_types text/plain text/xml text/css application/javascript;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain text/xml application/xml model/gltf-binary;

    include /etc/nginx/cabeceras.conf;

    # La página se revalida siempre; lo demás se guarda una semana.
    location ~ /index\.html$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/cabeceras.conf;
    }

    location ~* \.(css|js|webp|png|svg|jpg|woff2)$ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/cabeceras.conf;
    }

    # Modelo 3D de Bit (glTF binario).
    location ~* \.glb$ {
        types { }
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/cabeceras.conf;
    }

    # Para buscadores y asistentes de IA.
    location = /llms.txt {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/cabeceras.conf;
    }

    # Página de la web anterior de arcedatalab.com (WordPress).
    location ~ ^/acerca-de/?$ {
        return 301 https://arcedatalab.com/#arcedatalab;
    }

    # Para el sistema DEV/PRO: Ajustes pregunta aquí qué versión corre.
    location = /version/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files /version/index.json =404;
    }
    location = /version {
        return 301 version/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
