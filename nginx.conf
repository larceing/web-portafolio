# Fuera de arcedatalab.com (DEV, pro.luiscontacto03.com/web/…) la web no se indexa.
map $host $robots_cabecera {
    ~*^(www\.)?arcedatalab\.com$ "";
    default "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    absolute_redirect off;

    # La web vive en arcedatalab.com. Las direcciones anteriores
    # (www.arcedatalab.com, henry.arcedatalab.com, luiscontacto03.com y su www)
    # se redirigen con la misma ruta. Los subdominios de luiscontacto03.com
    # (pro., dev., users., citas.…) van a otros contenedores y no pasan por aquí.
    if ($host ~* ^(www\.arcedatalab\.com|henry\.arcedatalab\.com|(www\.)?luiscontacto03\.com)$) {
        return 301 https://arcedatalab.com$request_uri;
    }
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    charset utf-8;
    charset_types text/plain text/xml text/css application/javascript;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain text/xml application/xml model/gltf-binary;

    include /etc/nginx/cabeceras.conf;

    # La página se revalida siempre; lo demás se guarda una semana.
    location ~ /index\.html$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/cabeceras.conf;
    }

    location ~* \.(css|js|webp|png|svg|jpg|woff2)$ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/cabeceras.conf;
    }

    # Modelo 3D de Bit (glTF binario).
    location ~* \.glb$ {
        types { }
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/cabeceras.conf;
    }

    # Laboratorio de demos: estático, sin conexiones hacia fuera y sin indexar.
    # Cabeceras propias (más estrictas que las del resto) en vez de cabeceras.conf.
    location ^~ /lab/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Analítica (Umami Cloud) servida desde la propia web, porque los
    # bloqueadores frenan cloud.umami.is. /m/s.js es su script y /m/api/send
    # recibe las visitas. El resolver es el DNS de Docker: así el nombre se
    # busca al pedirlo y nginx arranca aunque Umami no responda.
    location = /m/s.js {
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $umami cloud.umami.is;
        proxy_pass https://$umami/script.js;
        proxy_ssl_server_name on;
        proxy_ssl_name $umami;
        proxy_set_header Host $umami;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/cabeceras.conf;
    }
    location = /m/api/send {
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $umami cloud.umami.is;
        proxy_pass https://$umami/api/send;
        proxy_ssl_server_name on;
        proxy_ssl_name $umami;
        proxy_set_header Host $umami;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        # IP real del visitante (la pone Nginx Proxy Manager) para el país y
        # para distinguir visitantes; Umami no la guarda.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Client-IP $http_x_real_ip;
        include /etc/nginx/cabeceras.conf;
    }

    # Para buscadores y asistentes de IA.
    location = /llms.txt {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/cabeceras.conf;
    }

    # Página de la web anterior de arcedatalab.com (WordPress).
    location ~ ^/acerca-de/?$ {
        return 301 https://arcedatalab.com/#arcedatalab;
    }

    # Para el sistema DEV/PRO: Ajustes pregunta aquí qué versión corre.
    location = /version/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files /version/index.json =404;
    }
    location = /version {
        return 301 version/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
