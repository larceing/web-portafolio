<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 969 603" width="969" height="603" font-family="Roboto Flex, Roboto, Segoe UI, system-ui, sans-serif">
  <defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <linearGradient id="cara" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3577B3"/><stop offset="1" stop-color="#1D4F7A"/></linearGradient>
    <linearGradient id="canto" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173F63"/><stop offset="1" stop-color="#0F2D49"/></linearGradient>
    <linearGradient id="marco" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF2F7"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#9CC3EA" stop-opacity=".55"/><stop offset="1" stop-color="#9CC3EA" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- tablet -->
  <rect x="200" y="92" width="600" height="420" rx="34" fill="#0F2340" opacity=".16" filter="url(#blur)"/>
  <rect x="190" y="60" width="600" height="420" rx="34" fill="url(#marco)" stroke="#DCE3EC"/>
  <rect x="210" y="80" width="560" height="380" rx="20" fill="#F5F8FC"/>
  <circle cx="490" cy="70" r="3" fill="#CBD5E1"/>

  <!-- schematic isometric office (line art) -->
  <g fill="none" stroke="#C4D4E5" stroke-width="1.5" stroke-linejoin="round">
    <path d="M560 128 L740 232 L560 336 L380 232 Z" fill="#FFFFFF"/>
    <path d="M470 180 L650 284 M650 180 L470 284" stroke="#E3EAF2"/>
  </g>
  <g stroke="#9FB9D3" stroke-width="1.5" stroke-dasharray="4 5" fill="none">
    <path d="M500 170 L392 330"/><path d="M640 170 L392 330"/><path d="M670 262 L392 330"/><path d="M560 300 L392 330"/>
  </g>
  <!-- desks: tiny iso blocks -->
  <g stroke="#B5C8DC" stroke-width="1.2" stroke-linejoin="round">
    <g transform="translate(500 162)"><path d="M0 -14 L24 0 L0 14 L-24 0 Z" fill="#FFFFFF"/><path d="M-24 0 L0 14 L0 24 L-24 10 Z" fill="#E9EFF6"/><path d="M24 0 L0 14 L0 24 L24 10 Z" fill="#DCE5EF"/></g>
    <g transform="translate(640 162)"><path d="M0 -14 L24 0 L0 14 L-24 0 Z" fill="#FFFFFF"/><path d="M-24 0 L0 14 L0 24 L-24 10 Z" fill="#E9EFF6"/><path d="M24 0 L0 14 L0 24 L24 10 Z" fill="#DCE5EF"/></g>
    <g transform="translate(670 254)"><path d="M0 -14 L24 0 L0 14 L-24 0 Z" fill="#FFFFFF"/><path d="M-24 0 L0 14 L0 24 L-24 10 Z" fill="#E9EFF6"/><path d="M24 0 L0 14 L0 24 L24 10 Z" fill="#DCE5EF"/></g>
    <g transform="translate(560 292)"><path d="M0 -14 L24 0 L0 14 L-24 0 Z" fill="#FFFFFF"/><path d="M-24 0 L0 14 L0 24 L-24 10 Z" fill="#E9EFF6"/><path d="M24 0 L0 14 L0 24 L24 10 Z" fill="#DCE5EF"/></g>
  </g>
  <g font-size="12" font-weight="500" fill="#3D4652">
    <g transform="translate(456 122)"><rect width="88" height="22" rx="11" fill="#FFFFFF" stroke="#E1E7EF"/><circle cx="13" cy="11" r="4" fill="#3A7BD5"/><text x="23" y="15">Comercial</text></g>
    <g transform="translate(604 122)"><rect width="76" height="22" rx="11" fill="#FFFFFF" stroke="#E1E7EF"/><circle cx="13" cy="11" r="4" fill="#E0A43A"/><text x="23" y="15">Pedidos</text></g>
    <g transform="translate(626 286)"><rect width="66" height="22" rx="11" fill="#FFFFFF" stroke="#E1E7EF"/><circle cx="13" cy="11" r="4" fill="#8A6FD1"/><text x="23" y="15">Planta</text></g>
    <g transform="translate(510 324)"><rect width="96" height="22" rx="11" fill="#FFFFFF" stroke="#E1E7EF"/><circle cx="13" cy="11" r="4" fill="#3AA57A"/><text x="23" y="15">Producción</text></g>
  </g>
  <!-- small connected-systems row at the bottom of the tablet screen -->
  <g font-size="12" font-weight="600" fill="#5A6471">
    <g transform="translate(430 392)"><rect width="84" height="38" rx="10" fill="#FFFFFF" stroke="#E1E7EF"/><text x="42" y="24" text-anchor="middle">Sindri · ERP</text></g>
    <g transform="translate(522 392)"><rect width="90" height="38" rx="10" fill="#FFFFFF" stroke="#E1E7EF"/><text x="45" y="24" text-anchor="middle">Brokkr · CRM</text></g>
    <g transform="translate(620 392)"><rect width="76" height="38" rx="10" fill="#FFFFFF" stroke="#E1E7EF"/><text x="38" y="24" text-anchor="middle">Reporting</text></g>
  </g>

  <!-- Ada, popping out in front (fake 3D) -->
  <ellipse cx="392" cy="350" rx="190" ry="150" fill="url(#halo)"/>
  <ellipse cx="380" cy="508" rx="92" ry="22" fill="#0F2340" opacity=".22" filter="url(#blur2)"/>
  <!-- base -->
  <ellipse cx="380" cy="492" rx="58" ry="19" fill="#0F2D49"/>
  <ellipse cx="380" cy="486" rx="58" ry="19" fill="#1D4F7A"/>
  <ellipse cx="380" cy="484" rx="44" ry="13" fill="#2A6699"/>
  <!-- pole -->
  <rect x="371" y="392" width="18" height="94" rx="6" fill="#163E61"/>
  <rect x="371" y="392" width="8" height="94" rx="4" fill="#245D90"/>
  <!-- screen: depth then face, skewed for the iso look -->
  <g transform="matrix(1 -0.18 0 1 0 0)">
    <rect x="276" y="280" width="226" height="168" rx="30" fill="url(#canto)" transform="translate(16 -8)"/>
    <rect x="276" y="280" width="226" height="168" rx="30" fill="url(#cara)"/>
    <rect x="290" y="294" width="198" height="140" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>
    <rect x="345" y="326" width="20" height="46" rx="10" fill="#FFFFFF"/>
    <rect x="413" y="326" width="20" height="46" rx="10" fill="#FFFFFF"/>
    <path d="M343 392 Q389 428 435 392" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <path d="M300 300 Q330 286 380 286" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(248 182)"><rect width="104" height="34" rx="17" fill="#0B2E4B"/><circle cx="20" cy="17" r="5" fill="#5CD69A"/><text x="34" y="23" font-size="15" font-weight="700" fill="#FFFFFF">Ada</text><text x="68" y="23" font-size="12" fill="#B9CCE0">al día</text></g>

  <!-- phone in front, overlapping the tablet -->
  <rect x="712" y="282" width="176" height="310" rx="30" fill="#0F2340" opacity=".2" filter="url(#blur)"/>
  <rect x="700" y="256" width="176" height="320" rx="30" fill="url(#marco)" stroke="#DCE3EC"/>
  <rect x="712" y="268" width="152" height="296" rx="22" fill="#FFFFFF" stroke="#EDF1F6"/>
  <rect x="766" y="276" width="44" height="8" rx="4" fill="#E3E8EE"/>
  <g transform="translate(724 300)">
    <rect width="26" height="26" rx="8" fill="#1D4F7A"/>
    <rect x="8" y="7" width="3" height="7" rx="1.5" fill="#FFFFFF"/><rect x="15" y="7" width="3" height="7" rx="1.5" fill="#FFFFFF"/>
    <path d="M8 17 Q13 21 18 17" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="34" y="12" font-size="13" font-weight="700" fill="#191C20">Ada</text>
    <text x="34" y="25" font-size="10.5" fill="#5A5F67">Pedidos · hoy</text>
  </g>
  <g font-size="11.5" fill="#2E3238">
    <g transform="translate(724 342)"><rect width="128" height="48" rx="12" fill="#F3F6FA"/><circle cx="14" cy="16" r="4" fill="#E0A43A"/><text x="24" y="20" font-weight="600">Pedido 1042</text><text x="12" y="37" fill="#5A5F67" font-size="10.5">Listo en el ERP</text></g>
    <g transform="translate(724 398)"><rect width="128" height="48" rx="12" fill="#F3F6FA"/><circle cx="14" cy="16" r="4" fill="#3AA57A"/><text x="24" y="20" font-weight="600">Lote 318</text><text x="12" y="37" fill="#5A5F67" font-size="10.5">Producido en planta</text></g>
    <g transform="translate(724 454)"><rect width="128" height="48" rx="12" fill="#F3F6FA"/><circle cx="14" cy="16" r="4" fill="#3A7BD5"/><text x="24" y="20" font-weight="600">Oferta Ruiz</text><text x="12" y="37" fill="#5A5F67" font-size="10.5">Para que la revises</text></g>
  </g>
  <g transform="translate(724 516)"><rect width="128" height="32" rx="16" fill="#1D4F7A"/><text x="64" y="21" text-anchor="middle" font-size="12.5" font-weight="600" fill="#FFFFFF">Revisar</text></g>
</svg>
